<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Play Manager — Ormoc City Pickleball</title>

    <!-- PWA: theme color for the browser chrome/OS task-switcher —
         CONNECT.PH navy (--color-primary in styles.js) -->
    <meta name="theme-color" content="#16355E" />

    <!-- PWA: iOS doesn't install from the Web App Manifest alone -- these
         Apple-specific tags are what make "Add to Home Screen" launch
         standalone (no browser chrome) with the right icon and title -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Open Play" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
