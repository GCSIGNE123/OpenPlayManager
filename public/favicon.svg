<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- CONNECT.PH-inspired mark: navy field, an open orange ring evoking the
       logo's "C", and a small orange connector dot at center. -->
  <circle cx="32" cy="32" r="30" fill="#16355E" />
  <circle
    cx="32"
    cy="32"
    r="20"
    fill="none"
    stroke="#F7941D"
    stroke-width="9"
    stroke-linecap="round"
    stroke-dasharray="106 20"
    transform="rotate(52 32 32)"
  />
  <circle cx="32" cy="32" r="5.5" fill="#F7941D" />
</svg>
